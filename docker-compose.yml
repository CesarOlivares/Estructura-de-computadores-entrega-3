# Orquestación del sistema — línea completa:
#   redis (colas + estado) · ordenes (API) · 4 estaciones · volumen de datos
#
# Los tiempos de ciclo se pueden ajustar por variables de entorno al levantar
# (p. ej. para experimentos); los valores por defecto son los del diseño.
# La base SQLite vive en el volumen `datos`: sobrevive a `docker compose down`.

# Configuración común de toda estación: misma imagen, mismo volumen; cada
# etapa solo cambia sus variables de entorno.
#
# Healthcheck (Fase 12): el chequeo corre DENTRO del contenedor con la python
# de la propia imagen (las imágenes slim no traen curl). Si /salud no responde,
# `docker compose ps` marca el servicio como unhealthy y se ve de un vistazo.
x-estacion: &estacion
  build: ./servicios/estacion
  volumes:
    - datos:/datos
  healthcheck:
    test: ["CMD", "python", "-c",
           "import urllib.request; urllib.request.urlopen('http://localhost:8080/salud', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 10s
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ordenes:
    build: ./servicios/ordenes
    container_name: ordenes
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      DB_RUTA: /datos/planta.db
      PLAZO_REDIS_S: ${PLAZO_REDIS_S:-2}
    volumes:
      - datos:/datos
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  # Servicio de métricas (Fase 9): solo LEE la base y las colas; no escribe.
  # Puerto 8001 porque el 8000 ya lo publica orders-api.
  metricas:
    build: ./servicios/metricas
    container_name: metricas
    ports:
      - "8001:8001"
    environment:
      REDIS_HOST: redis
      DB_RUTA: /datos/planta.db
      VENTANA_S: ${VENTANA_S:-60}
      # Mismos CICLO_* que usan las estaciones: si un experimento cambia un
      # tiempo de ciclo, los umbrales del cuello de botella se ajustan solos.
      TIEMPOS_CICLO: "fileteado:${CICLO_FILETEADO:-4},envasado:${CICLO_ENVASADO:-12},sellado:${CICLO_SELLADO:-3},esterilizacion:${CICLO_ESTERILIZACION:-7}"
      PLAZO_REDIS_S: ${PLAZO_REDIS_S:-2}
    volumes:
      - datos:/datos
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  fileteado:
    <<: *estacion
    environment:
      NOMBRE_ETAPA: fileteado
      COLA_ENTRADA: cola:fileteado
      COLA_SALIDA: cola:envasado
      TIEMPO_CICLO: ${CICLO_FILETEADO:-4}
      MODO_RECLAMO: ${MODO_RECLAMO:-atomico}
      PLAZO_REDIS_S: ${PLAZO_REDIS_S:-2}
      REDIS_HOST: redis
      DB_RUTA: /datos/planta.db

  # La etapa replicada: sin container_name para poder escalarla con
  # `docker compose up --scale envasado=3`.
  envasado:
    <<: *estacion
    environment:
      NOMBRE_ETAPA: envasado
      COLA_ENTRADA: cola:envasado
      COLA_SALIDA: cola:sellado
      TIEMPO_CICLO: ${CICLO_ENVASADO:-12}
      MODO_RECLAMO: ${MODO_RECLAMO:-atomico}
      PLAZO_REDIS_S: ${PLAZO_REDIS_S:-2}
      REDIS_HOST: redis
      DB_RUTA: /datos/planta.db

  # Réplica LENTA de envasado para el experimento de balanceo (Fase 7):
  # misma imagen y misma cola, el doble de tiempo de ciclo. Solo se levanta
  # a pedido con `docker compose --profile experimento up`.
  envasado-lento:
    <<: *estacion
    profiles: ["experimento"]
    environment:
      NOMBRE_ETAPA: envasado
      PREFIJO_REPLICA: envasado-lento
      COLA_ENTRADA: cola:envasado
      COLA_SALIDA: cola:sellado
      TIEMPO_CICLO: ${CICLO_ENVASADO_LENTO:-24}
      MODO_RECLAMO: ${MODO_RECLAMO:-atomico}
      PLAZO_REDIS_S: ${PLAZO_REDIS_S:-2}
      REDIS_HOST: redis
      DB_RUTA: /datos/planta.db

  sellado:
    <<: *estacion
    environment:
      NOMBRE_ETAPA: sellado
      COLA_ENTRADA: cola:sellado
      COLA_SALIDA: cola:esterilizacion
      TIEMPO_CICLO: ${CICLO_SELLADO:-3}
      MODO_RECLAMO: ${MODO_RECLAMO:-atomico}
      PLAZO_REDIS_S: ${PLAZO_REDIS_S:-2}
      REDIS_HOST: redis
      DB_RUTA: /datos/planta.db

  esterilizacion:
    <<: *estacion
    environment:
      NOMBRE_ETAPA: esterilizacion
      COLA_ENTRADA: cola:esterilizacion
      COLA_SALIDA: cola:listos
      TIEMPO_CICLO: ${CICLO_ESTERILIZACION:-7}
      MODO_RECLAMO: ${MODO_RECLAMO:-atomico}
      PLAZO_REDIS_S: ${PLAZO_REDIS_S:-2}
      REDIS_HOST: redis
      DB_RUTA: /datos/planta.db

  # Tablero de operaciones (Fase 11). Es la cara visible del sistema: consume
  # metrics-api para todos los numeros y orders-api para ingresar lotes. Lee
  # ademas el hash `estado:replicas` de Redis para el indicador de carga por
  # replica, que es el unico dato que ningun servicio expone por HTTP.
  ui:
    build: ./servicios/ui
    container_name: ui
    ports:
      - "8501:8501"
    environment:
      URL_ORDENES: http://ordenes:8000
      URL_METRICAS: http://metricas:8001
      REDIS_HOST: redis
    healthcheck:
      # Streamlit trae su propio endpoint de salud.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy

volumes:
  datos:
