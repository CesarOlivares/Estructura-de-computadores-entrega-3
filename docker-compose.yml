# Orquestación del sistema. Fase 4: orders-api + Redis con healthcheck.
# Los tiempos de ciclo se pueden ajustar por variables de entorno al levantar
# (p. ej. para experimentos); los valores por defecto son los del diseño.
services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ordenes:
    build: ./servicios/ordenes
    container_name: ordenes
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

  fileteado:
    build: ./servicios/estacion
    environment:
      NOMBRE_ETAPA: fileteado
      COLA_ENTRADA: cola:fileteado
      COLA_SALIDA: cola:envasado
      TIEMPO_CICLO: ${CICLO_FILETEADO:-4}
      MODO_RECLAMO: ${MODO_RECLAMO:-atomico}
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

  # La etapa replicada: sin container_name para poder escalarla con
  # `docker compose up --scale envasado=3`.
  envasado:
    build: ./servicios/estacion
    environment:
      NOMBRE_ETAPA: envasado
      COLA_ENTRADA: cola:envasado
      COLA_SALIDA: cola:sellado
      TIEMPO_CICLO: ${CICLO_ENVASADO:-12}
      MODO_RECLAMO: ${MODO_RECLAMO:-atomico}
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
